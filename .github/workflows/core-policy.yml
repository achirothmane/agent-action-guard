name: Core policy CI

on:
  pull_request:
    paths:
      - "agent_action_guard/**"
      - "tests/test_model.py"
      - "tests/test_loader.py"
      - "tests/test_engine.py"
      - "tests/test_serializer.py"
      - "tests/test_cli.py"
      - "tests/test_authority.py"
      - ".github/workflows/core-policy.yml"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic policy core tests
        run: |
          python -m unittest             tests.test_model             tests.test_loader             tests.test_engine             tests.test_serializer             tests.test_cli             tests.test_authority             -v
